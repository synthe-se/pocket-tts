[package]
name = "pocket-tts"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "High-performance CPU-based Text-to-Speech library using Candle"
keywords.workspace = true
categories.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
mkl = ["candle-core/mkl", "candle-nn/mkl", "dep:intel-mkl-src"]
# Apple Accelerate BLAS for the CPU path (macOS).
accelerate = ["candle-core/accelerate", "candle-nn/accelerate"]
# Kept for compatibility: int8 quantization is now always available.
quantized = []
# Non-WAV audio prompts (mp3/flac/ogg/m4a), the counterpart of upstream's
# optional soundfile dependency.
audio-formats = ["dep:symphonia"]
# WASM is handled by target, not feature flag - candle-core auto-detects wasm32 target
wasm = []
metal = ["candle-core/metal", "candle-nn/metal"]



[dependencies]
candle-core.workspace = true
candle-nn.workspace = true
candle-transformers.workspace = true
safetensors.workspace = true
anyhow.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
byteorder.workspace = true
tokenizers = { workspace = true, features = ["fancy-regex"] }
lenient_semver = "0.4.2"
rubato = "5.0.1"
regex = "1"
hound.workspace = true
rand.workspace = true
rand_distr.workspace = true
rayon = "1.12.0"
tracing.workspace = true

# Dependencies for all non-WASM targets
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
hf-hub.workspace = true
memmap2.workspace = true
# Plain http(s) URLs for configs and voices, like upstream's
# download_if_necessary (both already in the graph through hf-hub).
reqwest = { version = "0.13.5", features = ["blocking"] }
sha2 = "0.11.0"
symphonia = { version = "0.6", optional = true, features = ["mp3", "isomp4", "aac"] }
# sentencepiece removed - causes protobuf conflict with onnxruntime
# Using tokenizers crate's built-in SentencePiece support instead
tokenizers = { workspace = true, features = ["onig", "progressbar"] }

# MKL is x86-only; keeping it out of the default graph spares every other
# platform its ocipkg/getset build chain (future-incompat noise included).
[target.'cfg(target_arch = "x86_64")'.dependencies]
intel-mkl-src = { workspace = true, optional = true }

# WASM-specific dependencies
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["console"] }
# Turn on the browser backend of every getrandom in the graph: 0.4 for
# rand 0.10, 0.3 for candle's rand 0.9 and tokenizers' ahash.
getrandom = { version = "0.4", features = ["wasm_js"] }
getrandom_03 = { package = "getrandom", version = "0.3", features = ["wasm_js"] }
console_error_panic_hook = "0.1"

[[bench]]
name = "streaming_bench"
harness = false

[dev-dependencies]
criterion = "0.8.2"
candle-core.workspace = true
anyhow.workspace = true
[[bench]]
name = "full_benchmark"
harness = false

[[bench]]
name = "attention_bench"
harness = false

[[bench]]
name = "voice_state_bench"
harness = false
