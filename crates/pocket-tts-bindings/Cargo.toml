[package]
name = "pocket-tts-bindings"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Python bindings for Pocket TTS (Rust port)"
keywords.workspace = true
categories.workspace = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[lib]
name = "pocket_tts_bindings"
crate-type = ["cdylib"]

# `extension-module` is deprecated since pyo3 0.28: maturin >= 1.9.4 sets
# PYO3_BUILD_EXTENSION_MODULE itself, and build.rs adds the macOS
# `-undefined dynamic_lookup` arguments for manual builds.
[build-dependencies]
pyo3-build-config = "0.29.3"

[dependencies]
pyo3 = "0.29.3"
pocket-tts = { path = "../pocket-tts", version = "0.7.0" }
anyhow = "1.0"
candle-core = "0.11.0"
